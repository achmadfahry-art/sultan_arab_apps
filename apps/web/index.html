<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SULTAN ARAB APP — Absensi & Payroll</title>
  <meta name="description" content="Aplikasi operasional absensi multi-cabang, payroll, dan slip gaji Sultan Arab.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/jpeg" href="/assets/logo_sultan_arab.jpg">
</head>
<body>

  <div id="app-root">
    <!-- Dynamic SPA Views rendered by app.js:
         - View 1: Login (#login)
         - View 2: Dashboard Karyawan (#home)
         - View 3: Proses Absensi (#attendance)
         - View 4: Dashboard Owner / Pengelola (#management)
         - View 5: Riwayat & Slip (#payslips / #history)
    -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #C90000;">
      Memuat SULTAN ARAB APP...
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" style="position: fixed; bottom: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <script src="/app.js"></script>
</body>
</html>
