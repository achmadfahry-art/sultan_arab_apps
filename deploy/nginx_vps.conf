# Konfigurasi Reverse Proxy Nginx untuk SULTAN ARAB APP di VPS
# Tempatkan pada /etc/nginx/sites-available/sultan-arab.conf

server {
    listen 80;
    server_name absensi.sultanarab.com; # Ganti dengan domain atau IP VPS Anda

    # Redirect HTTP ke HTTPS otomatis setelah sertifikat SSL aktif
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name absensi.sultanarab.com;

    # SSL Certificates (Dikelola oleh Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/absensi.sultanarab.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/absensi.sultanarab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Batas ukuran upload foto bukti absensi (15MB)
    client_max_body_size 15M;

    # Reverse proxy ke Node.js backend port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
